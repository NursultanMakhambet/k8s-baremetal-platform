---
# Feature flags: drive what gets included (cluster, Argo CD, Helm, monitoring, Vault). Override per env.
is_k8s_cluster: true
is_ArgoCD_included: true   # install Argo CD when running platform playbook
is_Helm_included: true
is_Monitoring_included: true
is_Vault_included: true

minimal_master_memory_mb: 512
minimal_node_memory_mb: 512

environment_name: "lab"
main_domain: "k8s.local"

cluster_domain: "{{ environment_name }}.{{ main_domain }}"
control_plane_domain: "cp.{{ cluster_domain }}"

# Private container registry (GitOps: registry/ingress.yaml). Control host + cluster image refs.
private_registry_host: "registry.{{ cluster_domain }}"

trusted_networks:
  - 192.168.1.0/24

firewalld_trusted_networks: "{{ trusted_networks }}"

ingress_base_url: "https://{{ cluster_domain }}"
grafana_base_url: "https://grafana.{{ cluster_domain }}"
argocd_base_url: "https://argocd.{{ cluster_domain }}"

enable_ingress_controller: true
enable_cert_manager: true
enable_metrics_server: true

enable_monitoring: true
grafana_allowed_networks: "{{ trusted_networks }}"

enable_nfs_storage: true
enable_object_storage: false

enable_backup: true
backup_provider: "local"   # local | s3 | nfs

enable_network_policies: true
enable_pod_security_standards: true

# Firewalld + Calico: rich rules to NodeLocal DNS (169.254.25.10) are often not enough; trust pod CIDR so DNS works.
k8s_firewall_trust_pod_cidr: true

# If pods still cannot resolve via 169.254.25.10 (nslookup times out), direct INPUT/FORWARD rules are required.
k8s_firewall_nodelocaldns_direct: true

# kube-proxy rewrites ClusterIP -> pod IP; firewalld must allow pod CIDR -> pod CIDR or DNS to 10.233.0.3 also times out.
k8s_firewall_pod_to_pod: true

# Calico cross-node: outer IPs are on the node LAN; allow node-to-node mesh (same as trusted_networks).
k8s_firewall_allow_node_network_mesh: true
k8s_firewall_node_mesh_networks: "{{ trusted_networks }}"

# Argo CD install: use is_ArgoCD_included above, or override here.
# platform_install_argocd: true

