---
# prometheus-blackbox-exporter — probe targets are scraped via kube-prometheus
# additionalScrapeConfigs in helm-values/prometheus/values.yaml

fullnameOverride: prometheus-blackbox-exporter

config:
  modules:
    http_2xx:
      prober: http
      timeout: 10s
      http:
        valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
        follow_redirects: true
        preferred_ip_protocol: ip4
    http_post_2xx:
      prober: http
      timeout: 10s
      http:
        method: POST
    tcp_connect:
      prober: tcp
      timeout: 5s

serviceMonitor:
  enabled: true

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi
