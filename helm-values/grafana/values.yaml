---
# Grafana standalone values — bare-metal cluster

replicas: 1

# Requires a default StorageClass or set storageClassName. If no PVC binds: install e.g. local-path and mark default:
# kubectl apply -f https://raw.githubusercontent.com/rancher/local-path-provisioner/v0.0.30/deploy/local-path-storage.yaml
# kubectl annotate storageclass local-path storageclass.kubernetes.io/is-default-class=true
persistence:
  enabled: true
  size: 5Gi
  accessModes: ["ReadWriteOnce"]
  # storageClassName: local-path

# Default init runs `chown -R 472:472 /var/lib/grafana`; that often fails on local-path PVCs
# (permissions/SELinux on Rocky) and leaves the pod in Init:CrashLoopBackOff. Pod fsGroup 472
# still corrects volume ownership for the grafana container.
initChownData:
  enabled: false

admin:
  existingSecret: grafana-admin-credentials
  userKey: admin-user
  passwordKey: admin-password

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://prometheus-kube-prometheus-prometheus.monitoring.svc:9090
        access: proxy
        isDefault: true

# Required for dashboards[].gnetId downloads (chart generates download_dashboards.sh + mkdir)
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: ""
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default

# Imports from grafana.com (standalone Grafana has no kube-prometheus-stack bundled dashboards)
dashboards:
  default:
    node-exporter-full:
      gnetId: 1860
      revision: 37
      datasource: Prometheus
    prometheus-2-stats:
      gnetId: 3662
      revision: 2
      datasource: Prometheus
    kubernetes-cluster:
      gnetId: 7249
      revision: 1
      datasource: Prometheus
    kube-state-metrics:
      gnetId: 13332
      revision: 1
      datasource: Prometheus
    blackbox-exporter:
      gnetId: 7587
      revision: 1
      datasource: Prometheus
    # Editable copy: helm-values/grafana/dashboards/proxmox-smart.json (sync json: block when changing)
    proxmox-smart:
      json: |
        {
          "annotations": { "list": [] },
          "editable": true,
          "fiscalYearStartMonth": 0,
          "graphTooltip": 1,
          "id": null,
          "links": [],
          "liveNow": false,
          "panels": [
            {
              "datasource": "Prometheus",
              "fieldConfig": {
                "defaults": {
                  "color": { "mode": "palette-classic" },
                  "custom": { "drawStyle": "line", "fillOpacity": 10 },
                  "unit": "celsius"
                },
                "overrides": []
              },
              "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
              "id": 1,
              "options": { "legend": { "displayMode": "list", "placement": "bottom" } },
              "targets": [
                {
                  "expr": "smartctl_device_temperature{job=\"proxmox\",role=\"hypervisor\"}",
                  "legendFormat": "{{device}} {{temperature_type}}",
                  "refId": "A"
                }
              ],
              "title": "smartctl_temperature (smartctl_device_temperature)",
              "type": "timeseries"
            },
            {
              "datasource": "Prometheus",
              "fieldConfig": {
                "defaults": { "color": { "mode": "palette-classic" }, "unit": "h" },
                "overrides": []
              },
              "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
              "id": 2,
              "options": { "legend": { "displayMode": "list", "placement": "bottom" } },
              "targets": [
                {
                  "expr": "smartctl_device_power_on_seconds{job=\"proxmox\",role=\"hypervisor\"} / 3600",
                  "legendFormat": "{{device}}",
                  "refId": "A"
                }
              ],
              "title": "smartctl_power_on_hours (from smartctl_device_power_on_seconds)",
              "type": "timeseries"
            },
            {
              "datasource": "Prometheus",
              "fieldConfig": {
                "defaults": { "color": { "mode": "palette-classic" }, "unit": "short" },
                "overrides": []
              },
              "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
              "id": 3,
              "options": { "legend": { "displayMode": "list", "placement": "bottom" } },
              "targets": [
                {
                  "expr": "smartctl_device_attribute{job=\"proxmox\",role=\"hypervisor\",attribute_name=\"Reallocated_Sector_Ct\"}",
                  "legendFormat": "{{device}}",
                  "refId": "A"
                }
              ],
              "title": "smartctl_reallocated_sectors (Reallocated_Sector_Ct attribute)",
              "type": "timeseries"
            },
            {
              "datasource": "Prometheus",
              "fieldConfig": {
                "defaults": { "color": { "mode": "palette-classic" }, "unit": "short" },
                "overrides": []
              },
              "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
              "id": 4,
              "options": { "legend": { "displayMode": "list", "placement": "bottom" } },
              "targets": [
                {
                  "expr": "smartctl_device_attribute{job=\"proxmox\",role=\"hypervisor\",attribute_name=\"Current_Pending_Sector\"}",
                  "legendFormat": "{{device}}",
                  "refId": "A"
                }
              ],
              "title": "smartctl_current_pending_sectors (Current_Pending_Sector attribute)",
              "type": "timeseries"
            }
          ],
          "refresh": "30s",
          "schemaVersion": 39,
          "tags": ["proxmox", "smart", "hypervisor"],
          "templating": { "list": [] },
          "time": { "from": "now-6h", "to": "now" },
          "timepicker": {},
          "timezone": "",
          "title": "Proxmox SMART / storage",
          "uid": "proxmox-smart-storage",
          "version": 1
        }

# Do not enable sidecar dashboards/datasources while using datasources + dashboardProviders +
# dashboards (gnetId) above — the Grafana chart documents they must not be combined; mixing
# them often results in no dashboards (or broken provisioning).
sidecar:
  dashboards:
    enabled: false
  datasources:
    enabled: false

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi
