---
# kube-prometheus-stack values — bare-metal, 3 masters / 2 workers

defaultRules:
  create: true

alertmanager:
  enabled: true
  alertmanagerSpec:
    replicas: 2
    storage:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

prometheus:
  # Must be true or the Prometheus CR / StatefulSet is not created (Grafana will have no TSDB behind the Service).
  enabled: true
  prometheusSpec:
    replicas: 2
    retention: 15d
    scrapeInterval: 30s
    evaluationInterval: 30s
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        memory: 2Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi
    # Blackbox exporter (argocd/applications/exporters/blackbox-exporter.yaml) — HTTP/TCP probes
    # Proxmox hypervisor: node_exporter :9100 and smartctl_exporter :9633 (firewall must allow from Prometheus pods).
    additionalScrapeConfigs:
      - job_name: blackbox-http
        metrics_path: /probe
        params:
          module: [http_2xx]
        static_configs:
          - targets:
              - http://prometheus-kube-prometheus-prometheus.monitoring.svc:9090/-/healthy
              - http://grafana.monitoring.svc/api/health
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: prometheus-blackbox-exporter.monitoring.svc:9115
      - job_name: proxmox-node
        static_configs:
          - targets:
              - "192.168.1.2:9100"
            labels:
              job: proxmox
              role: hypervisor
              host: proxmox
        # Prometheus normally sets job from job_name; keep job=proxmox for queries/dashboards.
        relabel_configs:
          - target_label: job
            replacement: proxmox
          - target_label: role
            replacement: hypervisor
          - target_label: host
            replacement: proxmox
      - job_name: proxmox-smartctl
        static_configs:
          - targets:
              - "192.168.1.2:9633"
            labels:
              job: proxmox
              role: hypervisor
              host: proxmox
        relabel_configs:
          - target_label: job
            replacement: proxmox
          - target_label: role
            replacement: hypervisor
          - target_label: host
            replacement: proxmox
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false

# Standalone node exporter is deployed via argocd/applications/exporters/node-exporter.yaml — do not duplicate here.
# If the chart’s node-exporter DaemonSet is left enabled, host port 9100 conflicts and Argo CD sync can block
# (waiting for that DaemonSet) so the Prometheus StatefulSet never deploys — keep this false.
nodeExporter:
  enabled: false

kubeEtcd:
  enabled: true

kubeControllerManager:
  enabled: true

kubeScheduler:
  enabled: true

kubeProxy:
  enabled: true

grafana:
  enabled: false
