---
# Argo CD UI via Ingress (HTTP to argocd-server). TLS is optional at the ingress; no ssl-passthrough required.
# Requires argocd-cmd-params-cm server.insecure=true (see argocd-cmd-params-cm.yaml in this directory).
# Browser: "<any-node-IP> argocd.local" in /etc/hosts, then http://argocd.local:30801
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: platform
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
spec:
  ingressClassName: nginx
  rules:
    - host: argocd.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  name: http
