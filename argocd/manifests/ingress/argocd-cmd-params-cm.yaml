---
# Terminate TLS at the ingress; Argo CD serves HTTP on container port 8080 (service port name: http).
# After sync, restart argocd-server if the UI does not pick this up: kubectl rollout restart deployment/argocd-server -n argocd
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cmd-params-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cmd-params-cm
    app.kubernetes.io/part-of: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  server.insecure: "true"
