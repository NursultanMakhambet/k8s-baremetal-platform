---
# HTTP Ingress for Grafana.
# Browser: add to /etc/hosts (or DNS): "<any-node-IP> grafana.local"
# Then open: http://grafana.local:30801  (NodePort from ingress-nginx; see group_vars ingress_nginx_http_nodeport)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: platform
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: grafana.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 80
